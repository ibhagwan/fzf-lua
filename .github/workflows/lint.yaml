name: Lint

on: push

jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
      - name: Install libbfd
        run: |
          sudo apt-get update && sudo apt-get install -y binutils
          sudo ln -s /usr/lib/x86_64-linux-gnu/libbfd-2.42-system.so /usr/lib/x86_64-linux-gnu/libbfd-2.38-system.so

      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full clone to test on pinned sha

      - name: Install neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly

      - name: Install Emmylua
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make deps/emmylua

      - name: Lint
        run: |
          export XDG_DATA_HOME="$HOME/.local/share"
          make deps
          make lint
